<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Page Not Found | Strava Segment Attestations</title>
    <script src="/theme.js"></script>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
        background: light-dark(#f6f6f7, #0a0a0b);
        color: light-dark(#111113, #f2f2f3);
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }

      main {
        max-width: 34rem;
        text-align: center;
      }

      h1 {
        margin: 0 0 1rem;
        font-size: 2rem;
        line-height: 1.2;
      }

      p {
        margin: 0 0 2rem;
        color: light-dark(#3a3a41, #c9c9cf);
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0.875rem 1.5rem;
        border-radius: 8px;
        background: #c2410c;
        color: #ffffff;
        font-weight: 700;
        text-decoration: none;
      }

      :root[data-theme='light'] {
        color-scheme: light;
      }

      :root[data-theme='dark'] {
        color-scheme: dark;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>This page does not exist or has moved.</p>
      <a href="/">Back to home</a>
    </main>
  </body>
</html>
