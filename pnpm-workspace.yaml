packages:
  - 'packages/*'
allowBuilds:
  '@parcel/watcher': true
  '@reown/appkit': true
  bufferutil: true
  esbuild: true
  netlify-cli: true
  sharp: true
  unix-dgram: true
  utf-8-validate: true

catalog:
  # Build tools
  '@opentelemetry/api': 1.9.1

  # OpenZeppelin (must match verax-contracts requirements)
  '@openzeppelin/contracts': 4.9.6
  '@reown/appkit': 1.8.23
  '@reown/appkit-adapter-wagmi': 1.8.23

  # Wagmi & Viem
  '@tanstack/react-query': 5.102.8

  # Testing
  '@testing-library/jest-dom': 6.9.1
  '@testing-library/react': 16.3.3

  # Types
  '@types/node': 24.13.3
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.5

  # Verax
  '@verax-attestation-registry/verax-contracts': 10.0.0
  '@verax-attestation-registry/verax-sdk': 5.4.0
  '@vitejs/plugin-react': 6.1.1
  '@vitest/coverage-v8': 4.1.11
  '@wagmi/connectors': 8.0.7

  # Netlify
  dotenv-cli: 11.0.0

  # Linting & Formatting
  eslint: 10.9.1
  eslint-config-prettier: 10.1.8
  globals: 17.12.0

  # Solidity
  hardhat: 3.15.0
  netlify-cli: 26.2.0
  prettier: 3.9.6

  # React
  react: 19.2.8
  react-dom: 19.2.8
  react-router-dom: 7.18.3

  # TypeScript
  typescript: 6.0.3
  typescript-eslint: 8.69.0
  viem: 2.56.3
  vite: 8.2.2
  vitest: 4.1.11
  wagmi: 3.7.7
minimumReleaseAge: 4320
overrides:
  # GHSA-w5hq-g745-h8pq: Netlify toolchain accepts the patched uuid 11.x release.
  '@netlify/build>uuid': 11.1.1
  '@netlify/dev-utils>uuid': 13.0.1
  '@netlify/edge-bundler>uuid': 11.1.1
  '@types/node': 24.13.3
  # GHSA-q3j6-qgpj-74h6: force Verax GraphQL transitive paths onto the patched URI parser.
  fast-uri: 3.1.2
  # GHSA-w5hq-g745-h8pq: Netlify CLI and dev-utils accept the patched uuid 13.x release.
  'netlify-cli>uuid': 13.0.1
