packages:
  - 'packages/*'
allowBuilds:
  '@parcel/watcher': true
  '@reown/appkit': true
  bufferutil: true
  esbuild: true
  netlify-cli: true
  sharp: true
  unix-dgram: true
  utf-8-validate: true

catalog:
  # Build tools
  '@opentelemetry/api': 1.9.1

  # OpenZeppelin (must match verax-contracts requirements)
  '@openzeppelin/contracts': 4.9.6
  '@reown/appkit': 1.8.24
  '@reown/appkit-adapter-wagmi': 1.8.24

  # Wagmi & Viem
  '@tanstack/react-query': 5.104.1

  # Testing
  '@testing-library/jest-dom': 6.9.1
  '@testing-library/react': 16.3.3

  # Types
  '@types/node': 24.19.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0

  # Verax
  '@verax-attestation-registry/verax-contracts': 10.0.0
  '@verax-attestation-registry/verax-sdk': 5.4.0
  '@vitejs/plugin-react': 6.1.1
  '@vitest/coverage-v8': 4.1.11
  '@wagmi/connectors': 8.2.0

  # Netlify
  dotenv-cli: 11.0.0

  # Linting & Formatting
  eslint: 10.12.0
  eslint-config-prettier: 10.1.8
  globals: 17.13.0

  # Solidity
  hardhat: 3.18.1
  netlify-cli: 27.10.2
  prettier: 3.9.9

  # React
  react: 19.3.0
  react-dom: 19.3.0
  react-router-dom: 7.18.4

  # TypeScript
  typescript: 6.0.3
  typescript-eslint: 8.71.0
  viem: 2.57.2
  vite: 8.3.2
  vitest: 4.1.11
  wagmi: 3.7.7
minimumReleaseAge: 4320
overrides:
  '@graphql-tools/utils': 12.0.3
  fastify: 5.12.5
  proxy-addr: 2.0.8
  '@netlify/build': 37.3.3
  '@netlify/edge-bundler': 16.1.1
  '@netlify/functions-utils': 7.1.15
  '@netlify/zip-it-and-ship-it': 16.2.3
  axios: 1.20.0
  '@fastify/busboy': 3.2.2
  '@graphql-tools/executor-legacy-ws': 1.1.37
  http-cache-semantics: 4.3.0
  source-map-js: 1.2.2
  sharp: 0.35.5
  '@fastify/static': 10.1.5
  toml: 4.3.0
  # GHSA-mmx7-hfxf-jppx, GHSA-gcfj-64vw-6mp9 and related axios advisories: @coinbase/cdp-sdk pins axios 1.16.0; 1.18.0 is the first patched 1.x release.
  '@coinbase/cdp-sdk>axios': 1.20.0
  # GHSA-g7r4-m6w7-qqqr: Netlify bundlers pin esbuild 0.28.0; 0.28.1 is the patched release on the same line.
  '@netlify/edge-bundler>esbuild': 0.28.1
  '@netlify/zip-it-and-ship-it>esbuild': 0.28.1
  # Transitive @types/* packages accept any @types/node; keep a single version aligned with the Node 24 runtime.
  '@types/node': 24.19.0
