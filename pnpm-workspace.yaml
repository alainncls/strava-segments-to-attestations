packages:
  - 'packages/*'
allowBuilds:
  '@parcel/watcher': true
  '@reown/appkit': true
  bufferutil: true
  esbuild: true
  sharp: true
  unix-dgram: true
  utf-8-validate: true

catalog:
  # Build tools
  '@opentelemetry/api': 1.9.1

  # OpenZeppelin (must match verax-contracts requirements)
  '@openzeppelin/contracts': 4.9.6
  '@reown/appkit': 1.8.24
  '@reown/appkit-adapter-wagmi': 1.8.24

  # Wagmi & Viem
  '@tanstack/react-query': 5.104.4

  # Testing
  '@testing-library/jest-dom': 6.9.1
  '@testing-library/react': 16.3.3
  tsx: 4.23.15

  # Types
  '@types/node': 24.19.2
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0

  # Verax
  '@verax-attestation-registry/verax-contracts': 10.0.0
  '@verax-attestation-registry/verax-sdk': 5.4.0
  '@vitejs/plugin-react': 6.1.2
  '@vitest/coverage-v8': 4.1.12
  '@wagmi/connectors': 8.2.0

  # Linting & Formatting
  eslint: 10.13.0
  eslint-config-prettier: 10.1.8
  globals: 17.13.0

  # Solidity
  hardhat: 3.20.0
  prettier: 3.9.10

  # React
  react: 19.3.1
  react-dom: 19.3.1
  react-router-dom: 7.18.4

  # TypeScript
  typescript: 6.0.3
  typescript-eslint: 8.71.2
  viem: 2.57.7
  vite: 8.3.4
  vitest: 4.1.12
  wagmi: 3.7.7
minimumReleaseAge: 4320
overrides:
  # GHSA-w74x-v6f9-j3xg, GHSA-xhq7-xmqj-769h, GHSA-wjr9-j795-jxcr and
  # GHSA-333x-w4r6-6crp: the Verax GraphQL graph resolves vulnerable
  # fast-uri releases on three major lines. Pin each to its first patched line.
  fast-uri@<2.4.8: 2.4.8
  fast-uri@>=3.0.0 <3.1.9: 3.1.9
  fast-uri@>=4.0.0 <4.2.3: 4.2.3
  # GHSA-mrhx-c7xc-m3w5 / CVE-2023-54404: Reown AppKit 1.8.24 still resolves
  # Zod 3.x. Zod 4.6.6 is the first patched release; retain this exact override
  # until the upstream graph publishes an explicitly compatible resolution.
  zod: 4.6.6
  '@graphql-tools/utils': 12.0.3
  axios: 1.20.0
  '@fastify/busboy': 3.2.2
  '@graphql-tools/executor-legacy-ws': 1.1.37
  http-cache-semantics: 4.3.0
  source-map-js: 1.2.2
  # GHSA-mrwp-f3q8-3g9p: axios' allowed range still resolves vulnerable
  # follow-redirects 1.16.1 through the AppKit and Verax dependency graph.
  follow-redirects: 1.16.2
  # GHSA-mmx7-hfxf-jppx, GHSA-gcfj-64vw-6mp9 and related axios advisories: @coinbase/cdp-sdk pins axios 1.16.0; 1.18.0 is the first patched 1.x release.
  '@coinbase/cdp-sdk>axios': 1.20.0
  # GHSA-g7r4-m6w7-qqqr: Netlify bundlers pin esbuild 0.28.0; 0.28.1 is the patched release on the same line.
  # Transitive @types/* packages accept any @types/node; keep a single version aligned with the Node 24 runtime.
  '@types/node': 24.19.0
  # GHSA-4qv8-2p9j-2685 and seven related advisories: preserve the
  # transitive 7.x major while pinning its first patched mature release.
  undici@>=7.0.0 <7.30.1: 7.30.1
