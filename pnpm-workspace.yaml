packages:
  - 'packages/*'
allowBuilds:
  '@parcel/watcher': true
  '@reown/appkit': true
  bufferutil: true
  esbuild: true
  sharp: true
  unix-dgram: true
  utf-8-validate: true

catalog:
  # Build tools
  '@opentelemetry/api': 1.10.0

  # OpenZeppelin (must match verax-contracts requirements)
  '@openzeppelin/contracts': 4.9.6
  '@reown/appkit': 2.0.0
  '@reown/appkit-adapter-wagmi': 2.0.0

  # Wagmi & Viem
  '@tanstack/react-query': 5.108.0

  # Testing
  '@testing-library/jest-dom': 7.0.1
  '@testing-library/react': 16.3.3
  tsx: 4.23.15

  # Types
  '@types/node': 24.19.2
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0

  # Verax
  '@verax-attestation-registry/verax-contracts': 10.0.0
  '@verax-attestation-registry/verax-sdk': 5.4.0
  '@vitejs/plugin-react': 6.3.0
  '@vitest/coverage-v8': 5.1.1
  '@wagmi/connectors': 8.2.4
  '@wagmi/core': 3.6.9

  # Linting & Formatting
  eslint: 10.15.0
  eslint-config-prettier: 10.1.8
  globals: 17.14.0

  # Solidity
  hardhat: 3.22.0
  prettier: 3.10.1

  # React
  react: 19.3.1
  react-dom: 19.3.1
  react-router-dom: 7.18.5

  # TypeScript: `tsc` is TS 7; the `typescript` API stays on TS 6 for typescript-eslint and tsup.
  '@typescript/native': npm:typescript@7.0.2
  typescript: npm:@typescript/typescript6@6.0.2
  typescript-eslint: 8.73.0
  viem: 2.58.0
  vite: 8.3.8
  vitest: 5.1.1
  wagmi: 3.7.11
minimumReleaseAge: 10080
# Temporary: locked versions younger than minimumReleaseAge. Remove after 2026-11-25.
minimumReleaseAgeExclude:
  - '@rollup/rollup-android-arm-eabi@4.68.5'
  - '@rollup/rollup-android-arm64@4.68.5'
  - '@rollup/rollup-android-x64@4.68.5'
  - '@rollup/rollup-darwin-arm64@4.68.5'
  - '@rollup/rollup-darwin-x64@4.68.5'
  - '@rollup/rollup-freebsd-arm64@4.68.5'
  - '@rollup/rollup-freebsd-x64@4.68.5'
  - '@rollup/rollup-linux-arm-gnueabihf@4.68.5'
  - '@rollup/rollup-linux-arm-musleabihf@4.68.5'
  - '@rollup/rollup-linux-arm64-gnu@4.68.5'
  - '@rollup/rollup-linux-arm64-musl@4.68.5'
  - '@rollup/rollup-linux-loong64-gnu@4.68.5'
  - '@rollup/rollup-linux-loong64-musl@4.68.5'
  - '@rollup/rollup-linux-ppc64-gnu@4.68.5'
  - '@rollup/rollup-linux-ppc64-musl@4.68.5'
  - '@rollup/rollup-linux-riscv64-gnu@4.68.5'
  - '@rollup/rollup-linux-riscv64-musl@4.68.5'
  - '@rollup/rollup-linux-s390x-gnu@4.68.5'
  - '@rollup/rollup-linux-x64-gnu@4.68.5'
  - '@rollup/rollup-linux-x64-musl@4.68.5'
  - '@rollup/rollup-openbsd-x64@4.68.5'
  - '@rollup/rollup-openharmony-arm64@4.68.5'
  - '@rollup/rollup-win32-arm64-msvc@4.68.5'
  - '@rollup/rollup-win32-ia32-msvc@4.68.5'
  - '@rollup/rollup-win32-x64-gnu@4.68.5'
  - '@rollup/rollup-win32-x64-msvc@4.68.5'
  - '@tanstack/query-core@5.108.0'
  - '@tanstack/react-query@5.108.0'
  - '@tybys/wasm-util@0.10.5'
  - '@typescript-eslint/eslint-plugin@8.73.0'
  - '@typescript-eslint/parser@8.73.0'
  - '@typescript-eslint/project-service@8.73.0'
  - '@typescript-eslint/scope-manager@8.73.0'
  - '@typescript-eslint/tsconfig-utils@8.73.0'
  - '@typescript-eslint/type-utils@8.73.0'
  - '@typescript-eslint/types@8.73.0'
  - '@typescript-eslint/typescript-estree@8.73.0'
  - '@typescript-eslint/utils@8.73.0'
  - '@typescript-eslint/visitor-keys@8.73.0'
  - '@vitest/coverage-v8@5.1.1'
  - '@vitest/mocker@5.1.1'
  - '@vitest/spy@5.1.1'
  - 'minimatch@11.0.9'
  - 'rollup@4.68.5'
  - 'typescript-eslint@8.73.0'
  - 'viem@2.58.0'
  - 'vitest@5.1.1'
overrides:
  # GHSA-mrhx-c7xc-m3w5 / CVE-2023-54404: Reown AppKit 2.0.0 (appkit-wallet) still
  # resolves Zod 3.x. Zod 4.6.6 is the first patched release; retain this exact override
  # until the upstream graph publishes an explicitly compatible resolution.
  zod: 4.6.6
  '@graphql-tools/utils': 12.1.0
  # Transitive @types/* packages accept any @types/node; keep a single version aligned with the Node 24 runtime.
  '@types/node': 24.19.2
  # GHSA-3g3m-2fjr-6pw4 and GHSA-g3hv-75wg-m249: solhint 6.2.5 pins glob ^13,
  # which has no patched release and resolves vulnerable minimatch 10.x.
  'solhint>glob': 14.0.6
